<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Clean District</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="index.html" class="logo"
        > <span class="logo-icon">♻</span> CLEAN CALICUT
      >
      <nav class="menu">
        <a href="index.html">Home</a>
        <a href="request.html">Book pickup</a>
        <a href="track.html">Track</a>
        <!-- <a href="bookings.html">My bookings</a> -->
        <a href="admin.html" class="active">Admin</a>
      </nav>
      <a href="request.html" class="header-btn">Book now</a>
    </header>

    <main class="page wide">
      <p class="eyebrow">STAFF ONLY</p>
      <h1 class="page-title">Admin Dashboard</h1>

      <div class="stats">
        <div class="stat"><span id="statTotal">0</span>Total</div>
        <div class="stat"><span id="statPending">0</span>Pending</div>
        <div class="stat"><span id="statScheduled">0</span>Scheduled</div>
        <div class="stat"><span id="statCollected">0</span>Collected</div>
      </div>

      <div class="filter-bar">
        <label
          >Show:
          <select id="filter">
            <option value="all">All bookings</option>
            <option value="pending">Pending</option>
            <option value="scheduled">Scheduled</option>
            <option value="collected">Collected</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </label>
      </div>

      <div id="list"></div>
    </main>

    <footer class="site-footer">
      <p>© 2026 Clean District Waste Pickup. All rights reserved.</p>
    </footer>

    <script src="common.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
